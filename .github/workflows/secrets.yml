name: Secret scan

# Gitleaks over the whole history of what is being merged, on every PR and every push to main.
# No path filters: supabase/** (the server's code) is scanned too.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    # GitHub's Linux machines, never the self-hosted Mac.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, so a secret committed and later deleted is still found.
          fetch-depth: 0

      # The official gitleaks CLI, pinned and checked against the release's SHA-256.
      # To upgrade, change both values (the hash is in gitleaks_<version>_checksums.txt).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Every commit reachable from the checked-out commit: on a PR, all of main's history plus the
      # PR's commits; on main, all of main. Gitleaks' own default is `--all`, which would also scan
      # every other branch the full fetch brings along and fail unrelated PRs for them; a branch's
      # history is scanned when its own PR runs.
      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --log-opts="HEAD" --redact --verbose --no-banner --exit-code 1 .
