name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      SIMULATOR: iPhone 18 Pro
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and test on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alltag.xcodeproj \
            -scheme Alltag \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|warning:|Test case|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log
