changelog:
  exclude:
    labels: [epic, idea]
  categories:
    - title: ✨ Features
      labels: [feature]
    - title: 🎨 Design
      labels: [design]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Content
      labels: [content]
    - title: 🧱 Server and design system
      labels: [server, design-system]
    - title: ♿️ Accessibility
      labels: [accessibility]
    - title: 🧰 Chores & CI
      labels: [chore, ci, dependencies]
    - title: Other
      labels: ["*"]
