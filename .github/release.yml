changelog:
  exclude:
    labels: [epic]
  categories:
    - title: ✨ Features
      labels: [feature]
    - title: 🎨 Design
      labels: [design]
    - title: 🐛 Fixes
      labels: [bug]
    - title: ♿️ Accessibility
      labels: [accessibility]
    - title: 🧰 Chores & CI
      labels: [chore, ci, dependencies]
    - title: 📝 Docs
      labels: [docs]
    - title: Other
      labels: ["*"]
