          - 'Alltag/Features/Learn/**'
          - 'Alltag/Features/Write/**'
          - 'Alltag/Features/Read/**'
          - 'Alltag/Features/Listen/**'
          - 'Alltag/Features/Grammar/**'
          - 'Alltag/Features/Translate/**'
          - 'Alltag/Features/Articles/**'
          - 'AlltagTranslation/**'
memory:
  - changed-files:
      - any-glob-to-any-file:
          - 'Alltag/Features/Memory/**'
