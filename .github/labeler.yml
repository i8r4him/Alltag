# Maps changed paths to area labels (actions/labeler v5). One label per area of the app;
# the list of labels is in AGENTS.md, "Plan to launch".
onboarding:
  - changed-files:
      - any-glob-to-any-file:
          - 'Alltag/Features/Onboarding/**'
today:
  - changed-files:
      - any-glob-to-any-file:
          - 'Alltag/Features/Home/**'
          - 'Alltag/Features/Briefing/**'
          - 'Alltag/Features/Debrief/**'
          - 'Alltag/Features/SixtySeconds/**'
          - 'Alltag/Features/Situations/**'
conversation:
  - changed-files:
      - any-glob-to-any-file:
          - 'Alltag/Features/Conversation/**'
          - 'Alltag/Services/Realtime/**'
