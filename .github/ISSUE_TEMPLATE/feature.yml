name: Feature
description: Something to build, already sorted into a milestone
labels: [feature]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should be built?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What does the learner get from it?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] 
        - [ ] Tried on the iPhone, or noted as not verified
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design reference
      description: Screenshot file(s) from `screenshots/`, or a link.
