included:
  - Alltag
  - AlltagTests
  - AlltagWatch

excluded:
  - DerivedData
  - build

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 120

identifier_name:
  excluded: [id, x, y, i]

nesting:
  type_level: 2
